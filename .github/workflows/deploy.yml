name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ một lần deploy chạy cùng lúc; không huỷ lần đang chạy dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run lint

      - name: Build static site
        run: npm run build
        env:
          # Site chạy ở gốc tên miền riêng arena.nguyentuan.dev nên không cần đường dẫn con.
          # Nếu quay lại dùng <user>.github.io/<repo>, đặt PAGES_BASE_PATH: /<repo>.
          PAGES_BASE_PATH: ""
          NEXT_TELEMETRY_DISABLED: 1
          # Máy chủ TURN để hai máy khác mạng (4G/5G, wifi công ty) vẫn nối được — xem lib/net/ice.ts.
          # Đặt ở Settings → Secrets and variables → Actions; bỏ trống thì chỉ có STUN.
          NEXT_PUBLIC_TURN_URLS: ${{ secrets.TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          NEXT_PUBLIC_TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          NEXT_PUBLIC_TURN_API: ${{ secrets.TURN_API }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
